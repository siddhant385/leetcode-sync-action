name: "LeetCode+ Sync"
description: "Syncs your LeetCode submissions directly to GitHub"
author: "LeetCode+"

inputs:
  github_token:
    description: "GitHub Token for committing the code"
    required: true
    default: ${{ github.token }}
  leetcode_session:
    description: "LeetCode session cookie (LEETCODE_SESSION)"
    required: true
  leetcode_csrf_token:
    description: "LeetCode CSRF token cookie (csrftoken)"
    required: true
  generate_badge:
    description: "Whether to generate a badge for solved problems"
    required: false
    default: "false"
  badge_folder:
    description: "Folder to save the badge SVG"
    required: false
    default: ".badges"

runs:
  using: "node24"
  main: "dist/index.js"
